<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thinking and open questions by Yufeng Zhou on climate science.">
  <title>Thinking · Yufeng Zhou</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <!-- 顶部导航（当前页 Thinking 高亮） -->
  <header class="nav">
    <div class="container nav-inner">
      <a class="nav-brand" href="../index.html">Yufeng&nbsp;Zhou</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-menu" id="nav-menu">
        <a class="nav-link" href="research.html">Research</a>
        <a class="nav-link" href="publications.html">Publications</a>
        <a class="nav-link" href="activity.html">Activity</a>
        <a class="nav-link active" href="thinking.html">Thinking</a>
      </nav>
    </div>
  </header>

  <!-- 页头 -->
  <section class="page-header">
    <div class="container">
      <h1>Thinking</h1>
      <p class="page-desc">Ongoing thoughts and open questions. Each topic opens its own post, with a discussion area at the end.</p>
    </div>
  </section>

  <!-- ============================================================
       思考话题（论坛式列表：题目 / 简介 / 创建时间 / 互动留言数）
       数据来自 thinking-data.js（单一数据源），由下方脚本渲染，
       与首页保持一致。新增话题请改 thinking-data.js。
       ============================================================ -->
  <section class="section">
    <div class="container">
      <div class="thread-list" id="thinking-threads"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year">2026</span> Yufeng Zhou ·
        <a href="mailto:zyf21@mails.tsinghua.edu.cn">zyf21@mails.tsinghua.edu.cn</a></p>
    </div>
  </footer>

  <script src="../thinking-data.js"></script>
  <script>
    // 渲染论坛式话题列表（单一数据源，与首页同步）
    renderThinkingThreads(document.getElementById('thinking-threads'), '');

    document.getElementById('nav-toggle').addEventListener('click', function () {
      var m = document.getElementById('nav-menu');
      var o = m.classList.toggle('open');
      this.setAttribute('aria-expanded', o);
    });
    document.querySelectorAll('#nav-menu a').forEach(function (a) {
      a.addEventListener('click', function () { document.getElementById('nav-menu').classList.remove('open'); });
    });
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
