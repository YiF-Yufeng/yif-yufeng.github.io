<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thinking — a post by Yufeng Zhou.">
  <title>Thinking · Yufeng Zhou</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <!-- 公式渲染（KaTeX）；不用公式也无妨 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
</head>

<!-- ============================================================
     文章页（一个模板渲染所有 Thinking 文章）
     网址：post.html?id=<slug>，slug 对应 content/thinking.js 中的 posts[].slug
     正文来自 content/posts/<slug>.md；底部评论区为 giscus（配置见 content/site.js）
     ============================================================ -->
<body data-page="post" data-root="../">

  <div id="site-header"></div>

  <section class="page-header">
    <div class="container container-narrow">
      <div class="page-tags" id="page-tags"></div>
      <h1 id="page-title">Loading…</h1>
      <p class="page-desc" id="page-desc"></p>
      <div class="post-meta" id="post-meta"></div>
    </div>
  </section>

  <section class="section">
    <div class="container container-narrow">
      <article class="prose" id="prose"></article>

      <div class="comments" id="comments">
        <h2 class="sub-title">Discussion</h2>
        <div id="giscus"></div>
      </div>

      <p class="back-link"><a class="hl" href="thinking.html">← Back to Thinking</a></p>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"></script>
  <script src="../content/site.js"></script>
  <script src="../content/profile.js"></script>
  <script src="../content/thinking.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/pages.js"></script>
</body>
</html>
